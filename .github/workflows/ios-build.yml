# ============================================================================
# Dionite — CI: SwiftLint + static/leak analysis + unsigned .ipa on every push.
#
# Jobs (parallel):
#   cpp-checks  — g++ -Werror over every TU, clang static analysis,
#                 the 81-check campaign verifier, and a valgrind leak check
#                 over a full campaign run.          (ubuntu-latest)
#   swiftlint   — swiftlint lint --strict over the Swift/Metal host.
#                                                  (macos-14, preinstalled)
#   build-ipa   — xcodegen + xcodebuild, packaged as an unsigned Dionite.ipa
#                 artifact (no certificates/provisioning).  (macos-14)
# ============================================================================
name: iOS CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # C++ core: warnings are errors, static analysis, behavioral + leak gates.
  # ---------------------------------------------------------------------------
  cpp-checks:
    name: C++ compile / static & leak analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Compiler pass (every TU, warnings are errors)
        run: |
          set -eu
          files=$(find src -name '*.cpp' | sort)
          files="$files platforms/ios/Dionite/DioniteBridgeImpl.cpp"
          g++ -std=c++17 -Wall -Wextra -Wno-missing-field-initializers -Werror \
            -Isrc -Isrc/external -Iplatforms/ios/Dionite -fsyntax-only $files
          echo "OK: $(echo "$files" | wc -l) translation units compile clean"

      - name: Static analysis (clang --analyze, whole tree)
        run: |
          # Clang static analyzer over every TU (leaks, null derefs, uninitialized
          # values, dead stores). GCC's -fanalyzer was replaced here: on GCC 13 it
          # false-positives on any struct-with-std::string default construction and
          # on std::unordered_map insertion, which makes a -Werror gate useless.
          # Dynamic leak checking stays with valgrind in the step below.
          CLANGXX="$(command -v clang++-18 || command -v clang++-17 || command -v clang++-16 || command -v clang++-15 || command -v clang++ || true)"
          if [ -z "$CLANGXX" ]; then
            sudo apt-get update && sudo apt-get install -y clang
            CLANGXX="$(command -v clang++)"
          fi
          echo "Using $($CLANGXX --version | head -1)"
          failed=0
          count=0
          for f in $(find src -name '*.cpp' | sort) platforms/ios/Dionite/DioniteBridgeImpl.cpp; do
            out="$($CLANGXX -std=c++17 -Wall -Wextra -Isrc -isystem src/external \
              -Iplatforms/ios/Dionite --analyze -Xanalyzer -analyzer-output=text \
              -o /dev/null "$f" 2>&1)" || {
              echo "::error::analysis failed to run on $f"; echo "$out"; failed=1; continue; }
            if echo "$out" | grep -q "warning:"; then
              echo "::error::static analyzer findings in $f"
              echo "$out"
              failed=1
            fi
            count=$((count + 1))
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "OK: clang static analyzer clean on $count translation units"

      - name: Campaign verifier (81 checks over the full game loop)
        run: |
          set -eu
          g++ -std=c++17 -O1 -Isrc -Isrc/external \
            src/platforms/desktop/verify_campaign.cpp src/Game/GameRuntime.cpp \
            src/Combat/Weapons/WeaponBase.cpp src/Loot/Items/ItemBase.cpp \
            src/Audio/AudioManager.cpp \
            src/Progression/Skills/SkillLibrary.*.cpp -o dionite_verify
          ./dionite_verify

      - name: Leak check (valgrind over a full campaign run)
        run: |
          set -eu
          command -v valgrind >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y valgrind; }
          valgrind --leak-check=full --errors-for-leak-kinds=definite \
            --error-exitcode=99 ./dionite_verify
          echo "OK: no definite leaks, no invalid accesses"

  # ---------------------------------------------------------------------------
  # Swift host lint.
  # ---------------------------------------------------------------------------
  swiftlint:
    name: SwiftLint (strict)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Lint Swift/Metal host
        run: |
          set -eu
          command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint lint --strict

  # ---------------------------------------------------------------------------
  # Unsigned .ipa — no certificates, no provisioning profiles.
  # ---------------------------------------------------------------------------
  build-ipa:
    name: Build unsigned Dionite.ipa
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate project and package .ipa
        run: sh ./scripts/package_ipa.sh

      - name: Upload xcodebuild log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload Dionite.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Dionite-ipa
          path: |
            dist/Dionite.ipa
            dist/symbols/**
          if-no-files-found: error
